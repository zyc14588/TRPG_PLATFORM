name: release-readiness-evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-readiness-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-product-flow:
    name: release-readiness-evidence / golden-product-flow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Pin pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Generate Golden product-flow evidence
        env:
          TRPG_GOLDEN_EVIDENCE_DIR: ${{ runner.temp }}/golden-product-flow
        run: |
          mkdir -p "$RUNNER_TEMP/golden-product-flow"
          python3 scripts/ci/generate_evidence.py \
            --report "$RUNNER_TEMP/golden-product-flow/v1-row-14.json" \
            --artifact MANIFEST.md \
            --environment-key TRPG_GOLDEN_EVIDENCE_DIR \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/human-kp-tutorial.png" \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/ai-kp-tutorial.png" \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/login-error-mobile.png" \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/bootstrap.log" \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/compose-ps.json" \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/component-failure-gates.log" \
            --generated-artifact "$RUNNER_TEMP/golden-product-flow/live-browser-result.json" \
            -- bash -lc 'bash scripts/ci/golden-product-flow.sh "$TRPG_GOLDEN_EVIDENCE_DIR"'
          python3 scripts/ci/verify_evidence_schema.py --live-context "$RUNNER_TEMP/golden-product-flow/v1-row-14.json"
      - name: Upload Golden product-flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-product-flow-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/golden-product-flow
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    name: release-readiness-evidence / release-evidence
    needs: golden-product-flow
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    env:
      TRPG_REQUIRE_REAL_LOCAL_PROVIDERS: "1"
      TRPG_REQUIRE_REAL_CLOUD_PROVIDER: "1"
      TRPG_OLLAMA_EMBEDDING_MODEL: qwen3-embedding:8b
      OLLAMA_MODELS: ${{ vars.TRPG_OLLAMA_MODELS_DIRECTORY }}
      TRPG_LLAMA_SERVER_BIN: ${{ vars.TRPG_LLAMA_SERVER_BIN }}
      TRPG_LLAMA_CPP_EMBEDDING_MODEL_PATH: ${{ vars.TRPG_LLAMA_CPP_EMBEDDING_MODEL_PATH }}
      TRPG_REAL_CLOUD_CHAT_PROVIDER_URL: https://api.deepseek.com
      TRPG_REAL_CLOUD_CHAT_MODEL: deepseek-v4-flash
      TRPG_REAL_CLOUD_CHAT_MODEL_SHA256: ${{ vars.TRPG_REAL_CLOUD_CHAT_MODEL_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Pin pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact-SHA Golden product-flow evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: golden-product-flow-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-readiness
      - name: Start pinned integration services
        run: bash scripts/ci/integration-services.sh "$GITHUB_ENV"
      - name: Materialize the ephemeral cloud credential
        env:
          TRPG_REAL_CLOUD_CHAT_CREDENTIAL: ${{ secrets.TRPG_REAL_CLOUD_CHAT_CREDENTIAL }}
          TRPG_REAL_CLOUD_CHAT_CREDENTIAL_PATH: ${{ runner.temp }}/trpg-real-cloud-chat-credential
        run: |
          test -n "$TRPG_REAL_CLOUD_CHAT_CREDENTIAL"
          install -m 0600 /dev/null "$TRPG_REAL_CLOUD_CHAT_CREDENTIAL_PATH"
          printf '%s' "$TRPG_REAL_CLOUD_CHAT_CREDENTIAL" >"$TRPG_REAL_CLOUD_CHAT_CREDENTIAL_PATH"
      - name: Generate release input evidence
        env:
          TRPG_REAL_PROVIDER_EVIDENCE_DIR: ${{ runner.temp }}/release-readiness
          TRPG_REAL_CLOUD_CHAT_CREDENTIAL_PATH: ${{ runner.temp }}/trpg-real-cloud-chat-credential
        run: |
          mkdir -p "$RUNNER_TEMP/release-readiness"
          bash scripts/ci/generate-integration-evidence.sh "$RUNNER_TEMP/release-readiness/release-input.json"
          python3 scripts/ci/verify_evidence_schema.py --live-context "$RUNNER_TEMP/release-readiness/release-input.json"
      - name: Remove the ephemeral cloud credential
        if: always()
        env:
          TRPG_REAL_CLOUD_CHAT_CREDENTIAL_PATH: ${{ runner.temp }}/trpg-real-cloud-chat-credential
        run: rm -f "$TRPG_REAL_CLOUD_CHAT_CREDENTIAL_PATH"
      - name: Generate production security input evidence
        run: |
          host_docker_host="${DOCKER_HOST:-unix:///var/run/docker.sock}"
          host_daemon_id="$(DOCKER_HOST="$host_docker_host" docker info --format '{{.ID}}')"
          host_swarm_before="$(DOCKER_HOST="$host_docker_host" docker info --format '{{.Swarm.LocalNodeState}}')"
          dind_name="trpg-release-dind-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dind_shared="$RUNNER_TEMP/$dind_name"
          dind_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          cleanup_dind() {
            exit_code="$?"
            trap - EXIT INT TERM
            DOCKER_HOST="$host_docker_host" docker rm --force --volumes "$dind_name" >/dev/null 2>&1 || true
            rm -rf -- "$dind_shared"
            exit "$exit_code"
          }
          trap cleanup_dind EXIT INT TERM
          install -d -m 0700 "$dind_shared"
          DOCKER_HOST="$host_docker_host" docker run --detach \
            --name "$dind_name" \
            --privileged \
            --env DOCKER_TLS_CERTDIR= \
            --publish "127.0.0.1:$dind_port:2375" \
            --publish 127.0.0.1:25432:25432 \
            --publish 127.0.0.1:25433:25433 \
            --publish 127.0.0.1:26379:26379 \
            --publish 127.0.0.1:24222:24222 \
            --publish 127.0.0.1:29000:29000 \
            --publish 127.0.0.1:8080:8080 \
            --publish 127.0.0.1:8443:8443 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$dind_shared:$dind_shared:rw" \
            docker@sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5 \
            --host=tcp://0.0.0.0:2375 \
            --host=unix:///var/run/docker.sock \
            --tls=false
          export DOCKER_HOST="tcp://127.0.0.1:$dind_port"
          export TMPDIR="$dind_shared"
          export TRPG_CI_PUBLISHED_HOST=0.0.0.0
          for _ in {1..120}; do
            if docker info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker info >/dev/null
          test "$(docker info --format '{{.ID}}')" != "$host_daemon_id"
          dind_swarm_before="$(docker info --format '{{.Swarm.LocalNodeState}}')"
          test "$dind_swarm_before" = inactive
          python3 scripts/ci/generate_evidence.py \
            --report "$RUNNER_TEMP/release-readiness/production-security-input.json" \
            --artifact MANIFEST.md \
            --environment-key GITHUB_ACTIONS \
            --service-version-command '["docker_engine","docker","version","--format","{{.Server.Version}}"]' \
            --service-version-command '["docker_compose","docker","compose","version"]' \
            --service-version-command '["openssl","openssl","version"]' \
            -- bash scripts/ci/production-security-smoke.sh
          python3 scripts/ci/verify_evidence_schema.py \
            --live-context \
            "$RUNNER_TEMP/release-readiness/production-security-input.json"
          test "$(DOCKER_HOST="$host_docker_host" docker info --format '{{.Swarm.LocalNodeState}}')" = "$host_swarm_before"
      - name: Verify the truthful READY state
        run: |
          bash scripts/ci/generate-v1-acceptance-evidence.sh \
            "$RUNNER_TEMP/release-readiness" \
            "$RUNNER_TEMP/release-readiness/release-input.json" \
            "$RUNNER_TEMP/release-readiness/production-security-input.json" \
            "$RUNNER_TEMP/release-readiness/v1-row-14.json"
          python3 scripts/ci/generate_evidence.py \
            --report "$RUNNER_TEMP/release-readiness/evidence-manifest.json" \
            --artifact MANIFEST.md \
            --generated-artifact "$RUNNER_TEMP/release-readiness/release-input.json" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/release-input.log" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/release-input.junit.xml" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/release-input.sarif" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/production-security-input.json" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/production-security-input.log" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/production-security-input.junit.xml" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/production-security-input.sarif" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/acceptance-evidence-manifest.json" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/V1_ACCEPTANCE_EVIDENCE_MATRIX_FILLED.md" \
            --generated-artifact "$RUNNER_TEMP/release-readiness/release-readiness.json" \
            -- python3 scripts/ci/release_readiness.py \
              --report "$RUNNER_TEMP/release-readiness/release-readiness.json" \
              --evidence "$RUNNER_TEMP/release-readiness/release-input.json" \
              --security-evidence "$RUNNER_TEMP/release-readiness/production-security-input.json" \
              --acceptance-manifest "$RUNNER_TEMP/release-readiness/acceptance-evidence-manifest.json" \
              --acceptance-matrix "$RUNNER_TEMP/release-readiness/V1_ACCEPTANCE_EVIDENCE_MATRIX_FILLED.md" \
              --require-ready
          python3 scripts/ci/verify_evidence_schema.py --live-context "$RUNNER_TEMP/release-readiness/evidence-manifest.json"
      - name: Upload release readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-readiness-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-readiness
          if-no-files-found: error
          retention-days: 30
      - name: Clean self-hosted integration resources
        if: always()
        run: |
          if [[ -n "${TRPG_INTEGRATION_RUN_LABEL:-}" ]]; then
            mapfile -t integration_containers < <(
              docker ps --all --quiet \
                --filter "label=trpg.integration.run=$TRPG_INTEGRATION_RUN_LABEL"
            )
            if (( ${#integration_containers[@]} > 0 )); then
              docker rm --force "${integration_containers[@]}"
            fi
          fi
          integration_root="${TRPG_POSTGRES_CLIENT_MOUNT_ROOT:-}"
          if [[ -n "$integration_root" ]]; then
            case "$integration_root" in
              "$RUNNER_TEMP"/trpg-integration.*) rm -rf -- "$integration_root" ;;
              *) printf 'refusing unexpected integration root: %s\n' "$integration_root" >&2; exit 1 ;;
            esac
          fi
