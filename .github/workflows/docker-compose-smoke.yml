name: production-security-runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - .github/workflows/docker-compose-smoke.yml
      - scripts/ci/**
      - config/**
      - Dockerfile
      - compose.yml
      - docker-compose.ci.yml

permissions:
  contents: read

concurrency:
  group: production-security-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-runtime:
    name: production-security-runtime / security-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Pin pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Run production security boundaries with evidence
        run: |
          mkdir -p "$RUNNER_TEMP/production-security-runtime"
          python3 scripts/ci/generate_evidence.py \
            --report "$RUNNER_TEMP/production-security-runtime/evidence-manifest.json" \
            --artifact MANIFEST.md \
            --environment-key GITHUB_ACTIONS \
            --service-version-command '["docker_engine","docker","version","--format","{{.Server.Version}}"]' \
            --service-version-command '["docker_compose","docker","compose","version"]' \
            --service-version-command '["openssl","openssl","version"]' \
            -- bash scripts/ci/production-security-smoke.sh
          python3 scripts/ci/verify_evidence_schema.py \
            --live-context \
            "$RUNNER_TEMP/production-security-runtime/evidence-manifest.json"
      - name: Upload production security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-security-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-security-runtime
          if-no-files-found: error
          retention-days: 30
