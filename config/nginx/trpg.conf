upstream trpg_api {
    server api:8080;
}

upstream trpg_realtime {
    server realtime:8081;
}

upstream trpg_admin {
    server admin:8083;
}

server {
    listen 8080;
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ready","service":"reverse-proxy"}';
    }
    location / {
        return 308 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/reverse_proxy_tls_certificate;
    ssl_certificate_key /run/secrets/reverse_proxy_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://trpg_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location /realtime/ {
        proxy_pass http://trpg_realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location /admin/ {
        proxy_pass http://trpg_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        proxy_pass http://web/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
