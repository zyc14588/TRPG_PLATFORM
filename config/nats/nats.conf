listen: 0.0.0.0:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: "/data/jetstream"
}

tls {
  cert_file: "/run/secrets/nats_tls_certificate"
  key_file: "/run/secrets/nats_tls_private_key"
  ca_file: "/run/secrets/nats_tls_ca_certificate"
  verify: true
  timeout: 2
}

# Operator-managed user/NKey/JWT authorization; never committed to Git.
include /run/secrets/nats_authorization
