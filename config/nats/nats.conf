listen: 0.0.0.0:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: "/data/jetstream"
}

tls {
  cert_file: "/run/secrets/nats_tls_certificate"
  key_file: "/run/secrets/nats_tls_private_key"
  ca_file: "/run/secrets/nats_tls_ca_certificate"
  verify: true
  min_version: "1.2"
  handshake_first: true
  timeout: 2
}

# Operator-managed user/password, NKey, or JWT authorization; never committed
# to Git. The selected credential is delivered through an external secret.
# NATS include paths are always relative to the main configuration file.
# From /etc/trpg/nats/nats.conf this resolves to the Compose secret mount.
include ../../../run/secrets/nats_authorization
