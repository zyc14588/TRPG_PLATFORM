# Witness maintenance remains socket-only. This container is attached only to
# Compose's internal backend network; remote access is TLS-only and restricted
# to the dedicated witness owner. The CI security contract rejects an
# additional database network or production port.
local   all             all                                     peer
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl coc_ai_trpg_witness trpg_witness_owner samenet          scram-sha-256
hostssl all             all             0.0.0.0/0               reject
hostssl all             all             ::/0                    reject
