# Local maintenance remains socket-only and password authenticated. The
# official image exports PGPASSWORD while running initialization scripts, so
# this also permits the configured database owner to initialize without
# weakening the steady-state socket boundary.
local   all             all                                     scram-sha-256
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
# TCP access is limited to the product database and the only network attached
# to this container: Compose's internal backend network. `samenet` deliberately
# follows Docker IPAM without opening routed/public ranges; the CI security
# contract rejects any additional database network or production port.
hostssl coc_ai_trpg     trpg_database_owner    samenet          scram-sha-256
hostssl coc_ai_trpg     trpg_api_login         samenet          scram-sha-256
hostssl coc_ai_trpg     trpg_canonical_login   samenet          scram-sha-256
hostssl coc_ai_trpg     trpg_worker_login      samenet          scram-sha-256
hostssl coc_ai_trpg     trpg_realtime_login    samenet          scram-sha-256
hostssl coc_ai_trpg     trpg_backup_login      samenet          scram-sha-256
hostssl coc_ai_trpg_restore trpg_restore_login samenet          scram-sha-256
hostssl all             all             0.0.0.0/0               reject
hostssl all             all             ::/0                    reject
