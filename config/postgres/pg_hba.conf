# Local maintenance remains socket-only. Every TCP client must use TLS and
# SCRAM; plaintext TCP is rejected before authentication.
local   all             all                                     peer
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl all             trpg_api_login         0.0.0.0/0        scram-sha-256
hostssl all             trpg_api_login         ::/0             scram-sha-256
hostssl all             trpg_canonical_login   0.0.0.0/0        scram-sha-256
hostssl all             trpg_canonical_login   ::/0             scram-sha-256
hostssl all             trpg_worker_login      0.0.0.0/0        scram-sha-256
hostssl all             trpg_worker_login      ::/0             scram-sha-256
hostssl all             trpg_realtime_login    0.0.0.0/0        scram-sha-256
hostssl all             trpg_realtime_login    ::/0             scram-sha-256
hostssl all             all             0.0.0.0/0               reject
hostssl all             all             ::/0                    reject
