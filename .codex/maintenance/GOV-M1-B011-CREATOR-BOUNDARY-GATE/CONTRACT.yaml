- The repair requires a fourth path, a product path, a milestone-state change, or a public-contract, V1-scope, or exit-gate change.
- The proposed selection is permanent either/or, UI-controlled, package-specific, game-specific, or not fail-closed for malformed sentinel entries.
- Any PLAN registration change is functional rather than the contract plus two inert stable Section markers.
- Either preserved failed worktree is modified or reused as commit, merge, cherry-pick, or reset authority.
- Any required route, schema, binding, lineage, diff-scope, signature, test, vet, check, or license gate fails.
