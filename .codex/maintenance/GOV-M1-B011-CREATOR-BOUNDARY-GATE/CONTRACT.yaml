acceptance:
- >-
  The repair implements CAPABILITY_COUPLED_FRONTEND_BOUNDARY and never a
  permanent M0-or-generic either/or acceptance rule.
- >-
  Web Player always requires V1 restart baseline, No playable functionality,
  and M0 engineering shell only, whether the capability sentinel is absent or
  present.
- >-
  The sole capability sentinel is the exact repository path
  schemas/package/manifest-v2.schema.json; no batch ID, package ID,
  publisher, official-game identity, rules-residue identity, environment
  variable, manual flag, or UI text selects the boundary contract.
- >-
  Sentinel inspection uses exact-path Lstat semantics and does not follow a
  symlink: absence selects the Creator baseline, a regular file selects the
  generic JSON boundary, and a directory, symlink, or other non-regular entry
  fails closed.
- >-
  With the sentinel absent, Creator requires V1 restart baseline, No playable
  functionality, and M0 engineering shell only.
- >-
  With the sentinel present as a regular file, Creator requires all four
  markers: Schema-validated generic JSON; Package-generic JSON by design; No
  game-specific forms or templates; No playable preview or runtime execution.
- >-
  Missing any one of the four generic Creator markers fails; Creator UI bytes
  cannot choose the gate mode by containing a generic marker.
- >-
  The Web Player contract is isolated from the Creator transition, and
  deleting any Web Player M0 marker fails in both sentinel states.
- >-
  The implementation keeps boundary-copy validation generic, with a fixed Web
  Player contract and a Creator contract selected only from fail-closed
  sentinel state; concrete helper and type names remain implementation detail.
- >-
  A baseline fixture with no manifest-v2 file and all three Creator M0 markers
  passes.
- >-
  A temporary extension-capable fixture with a regular manifest-v2 file and
  all four generic Creator markers passes without modifying tracked Creator UI.
- >-
  A regular manifest-v2 file with only the old Creator M0 markers fails.
- >-
  Table-driven negative coverage removes each of the four generic markers in
  turn and every case fails.
- >-
  A directory sentinel fails, and a symlink sentinel fails wherever the test
  platform supports symlinks; an unsupported test platform is recorded
  explicitly and production behavior never follows the link.
- >-
  Production code and tests contain no game, package, publisher, official
  package, R2-INT-010, equipment, or rules-residue special-case selection
  condition.
- >-
  The repair candidate itself has no tracked manifest-v2 sentinel, so its
  baseline Creator remains valid and just check passes.
- >-
  A /tmp or overlay reconstruction probe presents a regular manifest-v2
  sentinel together with the accepted B010 Creator UI bytes to the same
  boundary check and passes, proving the recorded B011 blocker can be removed.
- >-
  Sentinel removal plus UI reversion may return this single boundary gate to
  baseline, so M1-B011 frozen product tests, schema tests, extension integration
  tests, and independent ACCEPT remain responsible for detecting capability
  loss.
- >-
  This maintenance neither replaces B011 product acceptance nor claims the
  sentinel is a complete capability security root.
- >-
  The four product normative references materialize only as
  NormativeReferences, never ReadOnDemand or AllowedScope, and grant no product
  write authority.
- >-
  M1 remains plan_version 23, M1-B002 remains BLOCKED, M1-B010 remains
  COMPLETED, and M1-B011 remains IMPLEMENTING with frozen contract
  fa7d260c4f77f164b6ae7f1582eb87b20a1f2b4cf59b37a799027e17bfe876a3.
