acceptance:
- The native recorder refuses to run unless the current tracked tree is clean and .codex/runtime/READING_MAP.yaml is a current, valid ACCEPT BATCH route whose source commit equals HEAD.
- The recorder derives candidate SHA, route binding, milestone, batch, frozen contract, repository identity material, and created_at instead of accepting caller overrides.
- Every FAIL finding requires a stable ID, severity, location, reproduction, violated requirement, expected, actual, repair boundary, and non-empty evidence refs; missing or partial payloads fail closed.
- Candidate, blocking commit, frozen contract, finding set digest, and native acceptance identity are deterministically cross-validated and emitted in canonical JSON.
- Candidate mismatch, blocking ancestry/state mismatch, route staleness, duplicate finding IDs, invalid severity, empty evidence, and digest tampering are rejected by negative tests.
- Output is atomically persisted only after full validation; invalid input leaves no output artifact.
- The implementation is generic and contains no M1-B002, PR #20, or ACC-008/009 special case.
- All required repository and governance checks pass without product or milestone-plan changes.
tests:
- env GOCACHE=/tmp/cutover-go-build go test ./internal/projectctl/... -count=1
- env GOCACHE=/tmp/cutover-go-build go test ./... -count=1
- env GOCACHE=/tmp/cutover-go-build go vet ./...
- just check
- git diff --check
- projectctl codex route --mode REPAIR --maintenance GOV-ACCEPTANCE-FINDING-PAYLOAD
- projectctl codex route --mode ACCEPT --maintenance GOV-ACCEPTANCE-FINDING-PAYLOAD
- projectctl codex check
stop_conditions:
- any required field cannot be derived from native route, repository state, independent ACCEPT evidence, or an authoritative clock
- exact candidate or blocking lifecycle identity cannot be proven locally
- implementation would need to edit product code, milestone state, the acceptance findings themselves, or remote state
- route, contract, stable Section ID, schema, atomic persistence, or required negative test cannot pass fail closed
