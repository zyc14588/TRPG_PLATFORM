forbidden_scope:
- Product or business implementation in this governance-maintenance contract.
- Modification of the completed M1 plan or allocation of M2 batches in REPAIR or ACCEPT mode.
- Changes to V1 scope, Lua backend identity, licenses, public Host API, CI required checks, or branch protection.
- Skipping milestones, advancing an incomplete milestone, or enabling IMPLEMENT without a real frozen batch.
- Changes to any existing frozen batch contract, acceptance threshold, tombstone, or historical result.
