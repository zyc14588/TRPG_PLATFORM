schema_version: 1
x-section-id: GOV-M2-PLANNING-ENTRY
maintenance_id: GOV-M2-PLANNING-ENTRY
objective:
- Enable a PLAN route for the consecutive next V1 milestone after the current milestone is COMPLETE, without replanning completed records or allowing future implementation.
- Bind milestone and governance-maintenance routes to the actual current milestone plan Section ID rather than a fixed M1 identity.
- Allow an initial NOT_GENERATED milestone planning route to derive its scope document from the existing authoritative roadmap; implementation and generated plans still require the dedicated scope and exit gate.
reason: >-
  The owner approved CHANGE-M2-PLANNING-ENTRY and requested continued M2 work.
  The existing plan lifecycle permits a completed milestone to advance to the next NOT_GENERATED baseline,
  but route validation prevents entering PLAN for that successor and route materialization fixes the M1 plan identity.
  M2 also has no dedicated scope document yet; initial planning must be possible before creating that document.
  Regression validation found four historical maintenance references and existing integration gates tied to the current M1 plan path; preserve the exact completed M1 archive and its established scope.

source_blocker: |-
  source commit: 500d07dac96460f36b6ae2953ae22d4133dea41a
  PLAN M2 actual exit 1: milestone M2 is outside the current M1 planning boundary.
  REPAIR GOV-M2-PLANNING-ENTRY actual exit 1: its governance-maintenance contract does not exist.
