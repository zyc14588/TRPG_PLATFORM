  section_id: SPEC-V1-ROADMAP-M2
  kind: normative-section
acceptance:
- The completed M1 plan archive is byte-identical to the accepted source; historical maintenance references and existing approved PostgreSQL/migration gates use that immutable M1 authority after transition, without granting new paths or imports.
- A valid COMPLETE M1 plan allows PLAN M2 while preserving the actual M1 plan Section ID in the route until the PLAN-only transition commits the M2 baseline.
- Same-milestone PLAN on COMPLETE, unfinished-predecessor PLAN, skipped milestones, historical PLAN, and future IMPLEMENT/ACCEPT/REPAIR fail closed.
- Before a dedicated successor scope exists, only initial PLAN may use the existing roadmap scope and exit; generated milestone plans and all batch routes require dedicated scope and exit sections.
- Governance-maintenance routes remain valid after M1-to-M2 transition and bind to the current plan metadata and hashes.
- M2 scope is resolved from a bounded roadmap-derived path after creation, without reading docs/** or changing M0/M1 normative semantics.
- Existing plan-mode, frozen-contract, monotonic-ID, Section ID, route-binding, signature, context-profile, schema, and clean-tree gates remain enforced.
- Targeted control-plane regressions and required Linux repository checks pass; no product implementation or M2 batch is created during maintenance.
tests:
- go test ./internal/projectctl
- just check
- just test
- just ci
- go vet ./...
- projectctl codex route --mode REPAIR --maintenance GOV-M2-PLANNING-ENTRY
- projectctl codex route --mode ACCEPT --maintenance GOV-M2-PLANNING-ENTRY
- projectctl codex route --mode PLAN --milestone M2
- projectctl codex check
stop_conditions:
- Any product implementation, V1 expansion, public-contract change, Lua backend change, or license change.
- Any need to skip a milestone, reopen COMPLETE history, mutate M1 plan in maintenance, or weaken a required acceptance gate.
- Invalid Section IDs, unbounded references, stale route, failed schema/binding/signature or required tests.
- Bootstrap mutation outside creation of this contract, or any reuse of Bootstrap after the formal REPAIR route passes codex check.
