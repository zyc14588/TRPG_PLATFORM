acceptance:
- >-
  M0 database integration stays denied. Only an M1 ACTIVE or COMPLETE plan with
  exactly one started, blocked, verifying, or completed M1-B003 batch whose
  recorded AND recomputed frozen digest equal the owner-approved digest
  authorizes the narrow PostgreSQL import exception. Missing, malformed,
  unreadable, stale, duplicate, or changed authority fails closed.
- >-
  The only allowed imports are database/sql and github.com/jackc/pgx/v5/stdlib,
  and the only permitted Go paths are cmd/platformd/packages.go,
  internal/storage/postgres/**, and tests/integration/package_install/**.
  Absolute paths, traversal, backslashes, lookalike prefixes, other products,
  package installers, and other drivers or pgx subpackages do not qualify.
- >-
  PostgreSQL integration is detected from parsed Go import declarations,
  including aliases, blank imports, raw or escaped string literals and import
  groups. Mentioning an import in a comment or fixture string is not linking
  that integration. Malformed declarations fail closed. Non-Go source keeps
  the existing lexical database and driver restrictions.
- >-
  Preserve every other forbidden integration and legacy, artifact, secret,
  single-module, required-path, and frontend-boundary check. Do not alter
  the B003 frozen contract or any product file to make the check pass.
- >-
  Positive and negative regression cases verify accepted paths/imports,
  exact frozen authority, M0 and unapproved states, modified contracts,
  path escape and lookalikes, driver variants, aliases and escaped imports,
  malformed imports, and the remaining forbidden integration tokens.
- >-
  A separate read-only ACCEPT sub-agent checks the exact signed governance
  commits, original failure, bounded diff, unchanged business/state bytes,
  native routes and checks, and regression evidence before B003 resumes.
tests:
- go test -count=1 -json ./internal/projectctl/...
- go vet ./internal/projectctl/...
- Fresh PLAN registration and REPAIR source routes pass projectctl codex check.
- Exact clean governance candidate just check and just license-check pass, with original failure retained.
- Independent ACCEPT route and diff validation preserve every non-allowlisted path and B003 frozen contract.
stop_conditions:
- Stop on any requirement to change product code, B003 frozen scope, M1 plan, dependency, or release platform obligations.
- Stop if M0 or unapproved PostgreSQL imports can pass through an unconditional or caller-controlled exception.
- Stop on any gate bypass without a failing regression fixture and owner-approved correction.
