  项目所有者进一步明确授权在同一 maintenance contract 下修复 ACC-M1-B002-005，使真实 milestone batch 冻结的
  reading_map_sections 被 route materialization、binding 与 stale detection 强制覆盖，且不得修改 milestone product contract。
