acceptance:
- REPAIR and ACCEPT governance-maintenance routes generate route_scope GOVERNANCE_MAINTENANCE without milestone or batch_id.
- IMPLEMENT governance-maintenance, invalid IDs, missing contracts, and simultaneous batch/maintenance targets fail closed.
- Maintenance Reading Map contains the contract, R25/R26, allowed scope, relevant schemas/code/tests, necessary M1 state, and forbidden bulk-read rules.
- codex/codex-default records context telemetry without applying 55%/70% project gates.
- opencode/opencode-deepseek-v4-flash requires explicit capacity and enforces soft 0.55/hard 0.70.
- Milestone Plan tests validate NOT_GENERATED, ACTIVE, COMPLETE and transition invariants without fixed production batch IDs or dependency graphs.
- IMPLEMENT, ACCEPT, and REPAIR routes for a real milestone batch materialize every frozen reading_map_sections entry exactly once with file/Section SHA-256 and route binding coverage.
- Missing or ambiguous frozen stable Section IDs fail route generation, and supplemental material or frozen-list changes make an existing route stale or non-canonical.
- All required repository checks pass and no M1 plan or product implementation is created.
tests:
- go test ./internal/projectctl
- go test ./...
- go vet ./...
- just check
- just test
- just ci
- projectctl codex route --mode REPAIR --maintenance GOV-M1-PLANNING-RUNTIME
- projectctl codex route --mode ACCEPT --maintenance GOV-M1-PLANNING-RUNTIME
- projectctl codex check
stop_conditions:
- expected base or maintenance identity changes
- any requirement to generate an M1 plan or allocate M1-B###
- any product/business implementation or V1 scope expansion
- unknown executor/profile or unconfirmed OpenCode capacity
- stale route, invalid binding, invalid Section ID, forbidden bulk read, schema failure, or test failure
