- 修复 Milestone Plan lifecycle governance tests，使其验证 NOT_GENERATED、ACTIVE、COMPLETE 状态机不变量而非永久仓库快照。
- 实现 R25 executor/profile-specific context policy，并保持所有非 context-ratio 治理门禁。
