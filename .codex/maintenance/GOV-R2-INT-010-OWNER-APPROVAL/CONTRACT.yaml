acceptance:
- The proposal front matter is APPROVED_FOR_PLAN / APPROVED_WITH_CONDITIONS and links to one ACTIVE owner approval record with matching proposal, owner decision, date, timezone, commit, and tree provenance.
- The registered approved and prohibited scopes exactly preserve the owner boundary and do not authorize M2-B002, M2-B009, full Creator Studio, formal equipment semantics/runtime, R2 changes, or rules-residue-specific platform behavior.
- M1-B002 remains exactly BLOCKED in MILESTONE_PLAN.yaml with frozen_contract_sha256 5dbcccd9ddda20bbcbdcbff473fb9197b83bb087a10f1ee802ed8ad547d74677; no field of its batch record changes from the proposal candidate.
- M1-B010 is not allocated or frozen by Phase B; it is the sole authorized next PLAN batch, and no IMPLEMENT/VERIFY batch is active. WIP_LIMIT=1 and parallel execution remains false.
- The minimum Creator form is SCHEMA_VALIDATED_GENERIC_JSON_EDITOR with supported import/inspect/edit/schema-validate/export/re-import, read-only lossless optional-unknown handling, and typed required-unsupported failure.
- Approval, proposal, fixture, or NOT_RUN is never represented as implementation evidence, capability PASS, Creator PASS, cross-repository PASS, or R2-INT-010 PASS.
- The candidate contains governance records and state summaries only, plus generated documentation if any; it contains no product implementation, M1-B010 plan allocation, or M1-B002 business change.
- projectctl produces a valid ACCEPT GOVERNANCE_MAINTENANCE route bound to the exact candidate commit/tree and all required checks pass from a clean tracked tree.
tests:
- go run ./cmd/projectctl codex route --mode ACCEPT --maintenance GOV-R2-INT-010-OWNER-APPROVAL
- go run ./cmd/projectctl codex check
- just check
- just test
- go vet ./...
- just license-check
- git diff --check
- git diff --name-only a767115af691b728c60bd272dce3fc01f2258bc7..HEAD
- git diff --exit-code a767115af691b728c60bd272dce3fc01f2258bc7..HEAD -- .codex/state/MILESTONE_PLAN.yaml internal cmd apps schemas/package
stop_conditions:
- proposal commit/tree or owner decision scope does not match the registered approval
- M1-B002 is not BLOCKED, its frozen contract changes, or any attempt is made to resume it
- M1-B010 must be allocated or frozen before the governance acceptance completes
- WIP_LIMIT=1 or serial execution cannot be represented without changing the lifecycle schema
- any product implementation, capability evidence, R2-INT-010 PASS, scope expansion, or unsupported Creator claim appears
- stale route, invalid binding, invalid stable Section ID, schema failure, or required test failure
