  - Snapshots, projections, and Lua checkpoints are treated as rebuildable accelerators and reject package-lock, profile, runtime, schema, or state-version mismatches.
  - Starting from no derived state and from each supported snapshot/checkpoint boundary yields the same final state hash, event cursor, permitted seat views, and VM-observable authoritative facts.
  - Replay consumes recorded random, time, accepted external structured actions, and tool results and proves that no AI/model or other external side effect is called again.
  - Failure during snapshot, projection, checkpoint, or Actor reactivation leaves authoritative history intact and permits a clean retry.
