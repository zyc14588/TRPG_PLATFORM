    and explicit unknown-commit recovery; idempotent retries recheck current revocation and cannot restore revoked
    successors.
  - Argon2id uses the approved fixed parameters and pinned dependency with bounded hashing/rates; passwords, Cookie,
    DSN and private participant content never appear in ordinary formatting/logs/exports.
