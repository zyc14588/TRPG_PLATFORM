  acceptance:
  - Version and required-entrypoint negotiation fails closed for an incompatible Host API range, missing callback, missing required capability, invalid Execution Token, wrong Session, or wrong package-module origin.
  - State patches, package data, events, idempotency results, tasks, Continuations, and Outbox writes remain in one read-your-writes MutationWorkspace and become visible together only after Lua and Go validation plus database commit.
