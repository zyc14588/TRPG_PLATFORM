  acceptance:
  - Explicit SQL persists accounts, workspaces and memberships with atomic workspace-owner creation; tenant-scoped reads and
    mutations reject cross-workspace and unknown-principal requests.
  - Guests are bound to a single room/game scope, cannot own a workspace/Campaign, upload packages, retain long-term credentials
    or obtain management roles; claim preserves scoped participation without automatic management grants.
  - Workspace membership administration does not grant a game seat or private-view access. Unknown, disabled, expired or removed
    actors fail closed using authoritative rows.
  - Internal application results and errors disclose no DSN, raw database error, credential or private participant content.
    Database constraints, rollback and concurrent membership changes are exercised against an owned disposable PostgreSQL
    instance.
  - This batch supplies foundation evidence for TEST-DATA-002 and TEST-PLAYER-003; final user-visible authenticated guest
    and complete tenant-isolation evidence remains in M2-B012.
  tests:
  - go test -count=1 -json ./internal/platform/core/...
  - go test -count=1 -tags integration -json ./tests/integration/platform_core/... requires an owned PostgreSQL database and
    fails instead of skipping when absent.
  - just check, just test, go vet ./..., and Linux just ci pass on a clean signed candidate.
  stop_conditions:
  - Stop for a new or changed public API/Schema, Host API, V1 scope, license, fixed Lua backend or acceptance gate unless
