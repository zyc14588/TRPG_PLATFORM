  acceptance:
  - Each active Session has exactly one logical SessionActor and bounded Mailbox; concurrent commands are serialized, saturation returns a stable backpressure error, and panic or failure is isolated from other Sessions.
  - Every command envelope enforces command_id, session_id, expected_state_version, authenticated fixture identity, seat_id, typed payload, and correlation_id before entering the MutationWorkspace.
  - Repeating a command_id returns its original committed result without rerunning Lua or duplicating events, database changes, tasks, Continuations, Outbox records, or broadcasts.
  - Event, state, package-data, idempotency, and Outbox changes commit atomically before Actor memory advances and before a seat-filtered ConnectionHub broadcast; rollback produces no broadcast.
  - Minimal reconnect uses an event cursor, revalidates the fixture seat, and returns only permitted events or projection; disconnect never silently transfers control.
  - TEST-SESSION-002 and TEST-SESSION-003 each produce a repeatable command, exit code, machine-readable result, and exact candidate SHA.
  tests:
  - "TEST-SESSION-002: go test -race ./internal/session/actor/... exercises single-writer ordering, bounded-mailbox backpressure, panic isolation, activation, sleep, and cleanup across concurrent Sessions."
  - "TEST-SESSION-003: go test ./internal/session/... ./internal/outbox/... exercises envelope validation, optimistic versioning, duplicate-command results, atomic failure injection, and the no-broadcast-before-commit invariant."
  - go test -tags=integration ./tests/integration/session/... uses PostgreSQL and a real lua-runner process for commit, rollback, reconnect, and seat-filtered projection scenarios.
  - just check, just test, go vet ./..., and just license-check pass from a clean tracked tree.
  stop_conditions:
  - Stop if more than one writer can mutate a Session or if Mailbox, retry, or management-command queues can grow without a hard bound.
  - Stop if any code path broadcasts, advances Actor state, or acknowledges success before the database transaction commits.
  - Stop if idempotency omits Lua, event, package-data, task, Continuation, Outbox, or response effects.
  - Stop if minimal identity/seat validation expands into a full account, Room/Lobby/invitation, Campaign, AI-seat, or official-game product.
  depends_on:
  - M1-B003
  - M1-B004
  parallel_safe: false
  dependency_independent: false
