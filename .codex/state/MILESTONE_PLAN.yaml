  acceptance:
  - The versioned TOML manifest and its schema distinguish game-system, content, assets, ui-extension, and library runtime packages from Bundle distribution containers, and library packages cannot start Sessions.
  - A package_id remains invariant across display metadata or version changes, while the artifact identity deterministically includes semantic version, content hash, build provenance, rights metadata, and the exact dependency lock.
  - Effective capabilities equal declared capabilities intersected with trust and execution-context grants; missing required capabilities reject the artifact and optional capabilities have tested fallback behavior without runtime escalation.
  - The lock records exact versions, content hashes, enabled Features, and transitive dependencies; resolution rejects direct and indirect cycles and more than one version of a package_id in one Session graph.
  - TEST-PACKAGE-001, TEST-PACKAGE-002, TEST-PACKAGE-003, and TEST-PACKAGE-004 each produce a repeatable command, exit code, machine-readable result, and exact candidate SHA.
  tests:
  - "TEST-PACKAGE-001 and TEST-PACKAGE-002: go test ./internal/package/... runs package-kind, immutable-identity, manifest-schema, provenance, and deterministic-artifact tests."
  - "TEST-PACKAGE-003: go test ./internal/package/capability/... exercises grant intersection, required-capability rejection, optional fallback, and no-escalation cases."
  - "TEST-PACKAGE-004: go test ./internal/package/dependency/... exercises exact/transitive locks, Feature hashing, single-version enforcement, and direct/indirect cycle rejection."
  - go test ./cmd/creator-cli/... verifies repeatable package build and validation behavior.
  - just check, just test, go vet ./..., and just license-check pass from a clean tracked tree.
  stop_conditions:
  - Stop if the executable manifest requires a new package kind, public Host API, identity rule, or dependency semantic not present in the active specifications and decisions.
  - Stop if any implementation path adds marketplace, Room/Lobby, official game, AI, Campaign, or Creator Studio functionality.
  - Stop if a dependency or source change requires altering the repository license, legal policy, normative governance, V1 scope, or an M1 exit gate.
  - Stop if any owned requirement lacks its mapped test evidence or if package inputs can bypass capability, rights, schema, or dependency validation.
