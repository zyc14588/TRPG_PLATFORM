  acceptance:
  - A Session lock records exact versions, hashes, Features, transitive dependency lock, Lua Profile, Host API, and Schema set for every game-system, content, assets, ui-extension, and library package and never re-resolves ranges at runtime.
  - Upgrade is denied unless the Session is not started, ended, or at a package-declared and platform-verified safe boundary with no in-flight Lua execution or critical Continuation.
  - Before mutation, the system creates a minimal M1 recovery point, locks new artifacts, rehearses namespace/relational data, snapshot, checkpoint, and lock migration in isolation, and verifies old-event replay and invariants.
  - Formal migration switches to the new hash atomically; injected failure leaves the old lock and all old events usable with no partial data, schema, snapshot, or checkpoint changes.
  - Rollback restores the pre-upgrade database/object manifest, package lock, snapshots, and checkpoints; no general automatic down-migration is claimed, and runtime DDL/raw SQL remain prohibited.
  - TEST-PACKAGE-008 produces repeatable real-service commands, exit codes, a machine-readable result, and the exact candidate SHA.
