  - go test -tags=integration ./tests/integration/replay/... rebuilds from empty derived state and every fixture checkpoint against PostgreSQL plus a real lua-runner process and compares state/event/view hashes.
  - Failure injection covers corrupt or stale snapshots/checkpoints, missing derived data, restart between commit and broadcast, and repeated activation.
