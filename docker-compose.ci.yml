# Runtime security override. The production model remains in compose.yml;
# this file only publishes isolated CI ports and replaces platform-managed
# external secrets with ephemeral files created by production-security-smoke.sh.
services:
  postgres:
    ports:
      - "${TRPG_CI_PUBLISHED_HOST:-127.0.0.1}:25432:5432"
    configs:
      - source: postgres_ci_hba
        target: /etc/trpg/postgres/pg_hba.conf
  postgres-witness:
    ports:
      - "${TRPG_CI_PUBLISHED_HOST:-127.0.0.1}:25433:5432"
    configs:
      - source: postgres_witness_ci_hba
        target: /etc/trpg/postgres/pg_hba.conf
  redis:
    ports:
      - "${TRPG_CI_PUBLISHED_HOST:-127.0.0.1}:26379:6379"
  nats:
    ports:
      - "${TRPG_CI_PUBLISHED_HOST:-127.0.0.1}:24222:4222"
  minio:
    ports:
      - "${TRPG_CI_PUBLISHED_HOST:-127.0.0.1}:29000:9000"

# Production keeps the backend network internal. The isolated runtime smoke
# must publish loopback-only ports to prove plaintext rejection and TLS/mTLS
# acceptance from outside each container, which Docker suppresses on an
# internal network.
networks:
  backend:
    internal: false

# The outer Dind bridge forwards loopback traffic into the inner daemon with
# source 172.17.0.1. Keep the production `samenet` rules and grant only that
# single isolated gateway TLS+SCRAM access; plaintext and every other source
# remain fail-closed. These configs replace the production targets only when
# this CI override is explicitly selected.
configs:
  postgres_ci_hba:
    content: |
      local all all scram-sha-256
      hostnossl all all 0.0.0.0/0 reject
      hostnossl all all ::/0 reject
      hostssl coc_ai_trpg trpg_database_owner samenet scram-sha-256
      hostssl coc_ai_trpg trpg_api_login samenet scram-sha-256
      hostssl coc_ai_trpg trpg_canonical_login samenet scram-sha-256
      hostssl coc_ai_trpg trpg_worker_login samenet scram-sha-256
      hostssl coc_ai_trpg trpg_realtime_login samenet scram-sha-256
      hostssl coc_ai_trpg trpg_backup_login samenet scram-sha-256
      hostssl coc_ai_trpg_restore trpg_restore_login samenet scram-sha-256
      hostssl coc_ai_trpg trpg_database_owner 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg trpg_api_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg trpg_canonical_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg trpg_worker_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg trpg_realtime_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg trpg_backup_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg_restore trpg_restore_login 172.17.0.1/32 scram-sha-256
      hostssl all all 0.0.0.0/0 reject
      hostssl all all ::/0 reject
  postgres_witness_ci_hba:
    content: |
      local all all scram-sha-256
      hostnossl all all 0.0.0.0/0 reject
      hostnossl all all ::/0 reject
      hostssl coc_ai_trpg_witness trpg_witness_append_login samenet scram-sha-256
      hostssl coc_ai_trpg_witness trpg_witness_read_login samenet scram-sha-256
      hostssl coc_ai_trpg_witness trpg_witness_owner samenet scram-sha-256
      hostssl coc_ai_trpg_witness trpg_witness_append_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg_witness trpg_witness_read_login 172.17.0.1/32 scram-sha-256
      hostssl coc_ai_trpg_witness trpg_witness_owner 172.17.0.1/32 scram-sha-256
      hostssl all all 0.0.0.0/0 reject
      hostssl all all ::/0 reject

