[package]
name = "trpg-api"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trpg-contracts = { path = "../trpg-contracts" }
trpg-shared-kernel = { path = "../trpg-shared-kernel" }

[dev-dependencies]
async-nats = { version = "0.49.1", default-features = false, features = ["jetstream", "nkeys", "ring", "server_2_10"] }
futures-util = "0.3"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
trpg-data-eventing = { path = "../trpg-data-eventing" }
trpg-domain-core = { path = "../trpg-domain-core" }
trpg-identity = { path = "../trpg-identity" }
trpg-ruleset-coc7 = { path = "../trpg-ruleset-coc7" }
trpg-runtime = { path = "../trpg-runtime" }
trpg-security-governance = { path = "../trpg-security-governance" }
trpg-test-support = { path = "../trpg-contracts/test-support" }
