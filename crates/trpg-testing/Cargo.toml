[package]
name = "trpg-testing"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
trpg-agent-runtime = { path = "../trpg-agent-runtime" }
trpg-domain-core = { path = "../trpg-domain-core" }
trpg-security-governance = { path = "../trpg-security-governance" }
trpg-shared-kernel = { path = "../trpg-shared-kernel" }
trpg-test-support = { path = "../trpg-contracts/test-support" }

[dev-dependencies]
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "macros", "migrate"] }
trpg-api = { path = "../trpg-api" }
trpg-data-eventing = { path = "../trpg-data-eventing" }
trpg-ruleset-coc7 = { path = "../trpg-ruleset-coc7" }
trpg-runtime = { path = "../trpg-runtime" }
