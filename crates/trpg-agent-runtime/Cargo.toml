[package]
name = "trpg-agent-runtime"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[dependencies]
async-trait = "0.1"
hmac = "0.12"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
trpg-contracts = { path = "../trpg-contracts" }
trpg-identity = { path = "../trpg-identity" }
trpg-runtime = { path = "../trpg-runtime" }
trpg-security-governance = { path = "../trpg-security-governance" }
trpg-shared-kernel = { path = "../trpg-shared-kernel" }
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "net"] }
trpg-test-support = { path = "../trpg-contracts/test-support" }
trpg-domain-core = { path = "../trpg-domain-core" }
