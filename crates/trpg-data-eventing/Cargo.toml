[package]
name = "trpg-data-eventing"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[dependencies]
async-nats = { version = "0.49.1", default-features = false, features = ["jetstream", "nkeys", "ring", "server_2_10"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
percent-encoding = "2.3"
redis = { version = "1.0", default-features = false, features = ["aio", "connection-manager", "script", "tokio-rustls-comp"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
trpg-contracts = { path = "../trpg-contracts" }
trpg-domain-core = { path = "../trpg-domain-core", features = ["canonical-store-internal"] }
trpg-identity = { path = "../trpg-identity" }
trpg-shared-kernel = { path = "../trpg-shared-kernel" }
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
futures-util = "0.3"
trpg-test-support = { path = "../trpg-contracts/test-support" }
