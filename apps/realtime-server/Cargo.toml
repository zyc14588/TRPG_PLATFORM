[package]
name = "realtime-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
trpg-api = { path = "../../crates/trpg-api" }
trpg-contracts = { path = "../../crates/trpg-contracts" }
trpg-data-eventing = { path = "../../crates/trpg-data-eventing" }
trpg-security-governance = { path = "../../crates/trpg-security-governance" }
