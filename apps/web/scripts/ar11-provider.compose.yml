services:
  ar11-provider:
    image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    command: ["python3", "/ar11-provider.py"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      AR11_MODEL_ID: ${AR11_MODEL_ID:?set AR11 model id}
      AR11_PRIVATE_CANARY: ${AR11_PRIVATE_CANARY:?set AR11 private canary}
    volumes:
      - ${AR11_PROVIDER_DIRECTORY:?set AR11 provider directory}:/provider:ro
      - ${AR11_REPOSITORY_ROOT:?set AR11 repository root}/apps/web/scripts/ar11-provider.py:/ar11-provider.py:ro
    networks:
      backend:
        aliases: [provider.test]
