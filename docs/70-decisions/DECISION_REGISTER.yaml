  statement: 使用包含协议版本、kind、route、seq、请求/关联 ID、Session、席位和状态版本的统一信封。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A09
  status: ACTIVE
  title: 静态路由中间件
  statement: 外部命令静态注册并固定执行协议、身份、工作区、席位、幂等、状态版本、限流与预算中间件。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A10
  status: ACTIVE
  title: 进程内 Gateway
  statement: Gate 落地为 platformd 内部 Gateway 与 ConnectionHub，不拆独立 Gate 服务。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A11
  status: ACTIVE
  title: Actor 范围
  statement: 仅活跃 Game Session 使用 Actor；账户、工作区、包和普通 Campaign 管理使用应用服务。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A12
  status: ACTIVE
  title: 有界 Mailbox
  statement: SessionActor 使用有界 Mailbox 串行处理命令，饱和时明确背压，Panic 隔离恢复。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A13
  status: ACTIVE
  title: Actor 生命周期
  statement: SessionActor 惰性激活、空闲休眠，从事件和快照恢复，不永久驻留。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A14
  status: ACTIVE
  title: 任务与 Outbox
  statement: 使用 PostgreSQL 持久任务表和 Transactional Outbox；不引入 Redis/NATS/Kafka 等。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A15
  status: ACTIVE
  title: Lua 版本
  statement: 游戏包公开语言标准采用 Lua 5.5 Platform Profile。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A16
  status: ACTIVE
  title: VM 实现解耦
  statement: Lua 语言契约与具体 VM 解耦，M1 比较官方 C Lua、纯 Go 实现等并通过统一兼容测试。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A17
  status: ACTIVE
  title: Lua 执行位置
  statement: Lua 在同主机独立 lua-runner 进程池中，通过 Unix Socket/Named Pipe/stdio 本地 IPC。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A18
  status: ACTIVE
  title: 包数据与脚本分离
  statement: 清单 TOML、模式 JSON Schema、内容 JSON/YAML、可执行规则 Lua、UI 声明/受限前端扩展分离。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A19
  status: ACTIVE
  title: Host Callback 变更模型
  statement: Lua 可返回事件，也可通过 Go Host Callback 修改事务工作区或请求受控数据库操作；不能直接持有连接。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A20
  status: ACTIVE
  title: Lua 确定性
  statement: 权威逻辑随机和时间只来自 Host API，稳定遍历/序列化，关键数值使用整数或固定精度，AI 不在确定性函数内同步调用。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A21
  status: ACTIVE
  title: Lua 依赖
  statement: 允许包内与锁定依赖 Lua 模块和 SDK；禁止运行时 LuaRocks、原生 C 模块、动态库、宿主路径和 Bytecode。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A22
  status: ACTIVE
  title: Session 长期 VM
  statement: 每个 Session 拥有独立长期 Lua VM，Session 结束后清理；运行时关键事实不得只存在 VM 内存。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A23
  status: ACTIVE
  title: Lua Host API 工具链
  statement: 提供最小能力 Host API、LuaLS、格式化、静态检查、固定种子、回滚、重放、预算、Studio 调试和 CI 认证。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A24
  status: ACTIVE
  title: 数据库
  statement: PostgreSQL + 显式 SQL；关系模型承载平台数据，追加事件表为权威历史，JSONB 仅用于受模式约束边界。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A25
  status: ACTIVE
  title: 存储搜索
  statement: 本地目录/S3-compatible 对象存储抽象与 PostgreSQL 全文检索；V1 不引入独立搜索集群。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A26
  status: ACTIVE
  title: Web Player 技术
  statement: React + TypeScript + Vite。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A27
  status: ACTIVE
  title: Creator Studio 技术
  statement: Wails + Go + React/TypeScript，稳定版本审查后锁定。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R14-A28
  status: ACTIVE
  title: Monorepo
  statement: 单一 Monorepo，根 Go Module、pnpm Workspace、共享 Schema、官方游戏与平台同仓。
  source_stage: R14
  scope: V1_AND_LONG_TERM
  specifications: *id015
- decision_id: R15-A01
  status: ACTIVE
  title: 事务工作区
  statement: Lua 状态与数据库修改先进入命令级事务工作区，通过验证后统一提交。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: &id016
  - SPEC-HOST-CALLBACK-001
  - SPEC-LUA-RUNTIME-001
- decision_id: R15-A02
  status: ACTIVE
  title: 完整回滚
  statement: Lua 执行失败时回滚本次状态、数据库、事件、任务、Outbox 和运行时修改。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A03
  status: ACTIVE
  title: 异步外部任务
  statement: 权威规则执行期间不得同步等待 AI 或外部服务，只能创建持久任务和 Continuation。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A04
  status: ACTIVE
  title: 私人包数据库
  statement: 普通创作者包只能使用平台提供的模式化命名空间数据接口。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A05
  status: ACTIVE
  title: 受信包关系操作
  statement: 官方和受信签名包可声明私有关系表和命名数据库操作，但仍由 Go 执行且无原始连接。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A06
  status: ACTIVE
  title: 运行期 DDL 禁止
  statement: Session 运行期间禁止 DDL；结构变化只在安装/升级迁移阶段。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A07
  status: ACTIVE
  title: 一致性读取
  statement: 同一命令使用一致性视图和事务覆盖层，并能读取自己的暂存写入。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A08
  status: ACTIVE
  title: Lua 全局非权威
  statement: Lua 全局变量只作缓存和临时状态；权威事实必须进共享状态、事件或检查点。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A09
  status: ACTIVE
  title: VM 恢复
  statement: 重启时重新创建 VM，加载包并恢复只含允许基本类型的显式运行时检查点。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A10
  status: ACTIVE
  title: Coroutine
  statement: Coroutine 不直接跨命令保存调用栈；长期等待使用持久 Continuation/Task Token。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A11
  status: ACTIVE
  title: 内存压力重建
  statement: 尚未结束 Session 的 VM 仅在成功创建与当前状态一致的检查点后可提前重建。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A12
  status: ACTIVE
  title: 信任分级数据库能力
  statement: 官方/受信包可使用审核关系操作；私人包仅受限命名空间。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A13
  status: ACTIVE
  title: 生产 Debug 禁令
  statement: 生产环境所有包一律不加载 Lua Debug Library、远程 REPL 或动态调试组件。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A14
  status: ACTIVE
  title: 回调预算
  statement: 每次执行限制回调次数、递归、CPU、内存、时间、查询结果、状态补丁、事件和输出。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R15-A15
  status: ACTIVE
  title: 分级审计
  statement: Host Callback 分 AUDIT-0 至 AUDIT-3 记录；生产最低审计不可关闭并按等级脱敏。
  source_stage: R15
  scope: V1_AND_LONG_TERM
  specifications: *id016
- decision_id: R16-A01
  status: ACTIVE
  title: 不可变包 ID
  statement: package_id 使用发布者命名空间和稳定短名，改显示名称或版本不改变内部身份。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: &id017
  - SPEC-PACKAGE-001
  - SPEC-MIGRATION-001
- decision_id: R16-A02
  status: ACTIVE
  title: 发布物身份
  statement: 语义版本、内容哈希和构建来源共同标识发布物；Session 锁定精确哈希。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A03
  status: ACTIVE
  title: TOML 清单
  statement: 包清单使用版本化 TOML，复杂模式使用 JSON Schema。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A04
  status: ACTIVE
  title: 能力授权
  statement: 包声明所需最小能力，安装时按信任等级验证授予，未声明/未批准能力不可用。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A05
  status: ACTIVE
  title: 认证绑定
  statement: 签名与认证绑定内容哈希、依赖锁、Lua Profile、Host API 和测试套件版本。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A06
  status: ACTIVE
  title: 标准 Lua 入口
  statement: 平台定义版本化生命周期、命令、视图、检查点、恢复、Continuation、迁移和清理入口。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A07
  status: ACTIVE
  title: Host API 版本
  statement: 包声明 Host API 主版本和允许次版本范围，不兼容或缺能力时拒绝加载。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A08
  status: ACTIVE
  title: 命令事件模式
  statement: 每个命令和事件有稳定模式 ID、版本和 JSON Schema，并生成 Go/TypeScript/Lua 辅助。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A09
  status: ACTIVE
  title: 事件不可改写
  statement: 已发布事件语义不得复用或静默修改；通过新版本、兼容投影和 Upcaster 读取旧历史。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A10
  status: ACTIVE
  title: 安全错误模型
  statement: 对外使用稳定错误代码和安全消息，Lua 栈、SQL和私密状态只在独立诊断中受控查看。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A11
  status: ACTIVE
  title: 私人包数据模型
  statement: 私人包命名空间为带 JSON Schema、版本和声明式索引的文档/键值模型。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A12
  status: ACTIVE
  title: 关系扩展清单
  statement: 官方/受信包通过包内受审查关系模式、迁移和命名操作清单安装。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A13
  status: ACTIVE
  title: 升级迁移
  statement: 停止新 Session、建备份/恢复点、隔离副本预演、原子迁移、验证事件/快照/检查点后启用。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A14
  status: ACTIVE
  title: 降级策略
  statement: 不承诺通用自动降级；回退通过恢复升级前备份、旧包和旧依赖锁。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R16-A15
  status: ACTIVE
  title: 运行中版本锁
  statement: 活跃 Session 只在结束或包声明且平台验证的安全边界显式升级。
  source_stage: R16
  scope: V1_AND_LONG_TERM
  specifications: *id017
- decision_id: R17-A01
  status: ACTIVE
  title: library 包
  statement: 增加 library 包类型用于可复用 Lua 模块、模式和 UI 组件，不能独立启动 Session。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: &id018
  - SPEC-PACKAGE-TRUST-001
  - SPEC-INCIDENT-001
- decision_id: R17-A02
  status: ACTIVE
  title: 版本范围与锁
  statement: 源清单可声明兼容范围，构建生成精确版本、哈希和 Feature 锁文件。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A03
  status: ACTIVE
  title: 多版本共存
  statement: 部署可安装同包多个版本，但单个 Session 依赖图只能解析一个精确版本。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A04
  status: ACTIVE
  title: 拒绝循环依赖
  statement: 构建和安装阶段拒绝直接或间接循环依赖。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A05
  status: ACTIVE
  title: 可选依赖 Feature
  statement: 允许显式可选依赖与 Feature，启用状态进入哈希、锁、认证和 Session 包锁。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A06
  status: ACTIVE
  title: 原子导入安装
  statement: 隔离暂存、解包安全、清单/模式、依赖、签名/权利、测试后原子安装。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A07
  status: ACTIVE
  title: 内容寻址存储
  statement: 包对象按内容哈希不可变保存，拒绝路径穿越、链接逃逸、压缩炸弹和超限文件。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A08
  status: ACTIVE
  title: 物理与逻辑分层
  statement: 部署物理对象、工作区逻辑安装、房间选择、Session 精确锁定分层。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A09
  status: ACTIVE
  title: 卸载保留
  statement: 有 Campaign、Session、恢复点、依赖、审计或法律引用时只能停用，不能物理删除。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A10
  status: ACTIVE
  title: 跨工作区去重
  statement: 相同哈希可物理去重，但权限、许可、可见性和安装状态独立。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A11
  status: ACTIVE
  title: 双签名
  statement: 发布者签名证明来源完整性，平台认证签名证明测试结果，两者独立。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A12
  status: ACTIVE
  title: 发布者密钥链
  statement: 发布者密钥版本化，支持轮换、撤销、泄露状态和继任证明。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A13
  status: ACTIVE
  title: 未签名包
  statement: 只可在开发工作区和明确提示的私人房间使用，不得成为受信或官方发行内容。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A14
  status: ACTIVE
  title: 信任提升
  statement: 签名、自动认证、必要人工审核后才可提升；官方包还需独立发行允许清单。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R17-A15
  status: ACTIVE
  title: 强制安全撤销
  statement: 签名/认证安全撤销或严重安全问题时，阻止新使用并立即终止所有受影响现有 Session，保留证据等待审计。
  source_stage: R17
  scope: V1_AND_LONG_TERM
  specifications: *id018
- decision_id: R18-A01
  status: ACTIVE
  title: Compose 拓扑
  statement: 正式 Compose 分别运行 platformd、workerd、lua-runner、PostgreSQL 和对象存储，固定同一主机且不水平复制。
  source_stage: R18
  scope: V1_AND_LONG_TERM
  specifications: &id019
  - SPEC-DEPLOYMENT-001
  - SPEC-OPS-001
  - SPEC-INCIDENT-001
- decision_id: R18-A02
  status: ACTIVE
  title: TLS 反向代理
  statement: 支持外部反向代理并提供官方入口配置；核心只信任配置代理和标准转发头。
  source_stage: R18
  scope: V1_AND_LONG_TERM
  specifications: *id019
- decision_id: R18-A03
  status: ACTIVE
  title: 生产秘密
  statement: 秘密通过环境变量引用和只读文件提供，不写仓库、普通配置、命令行或日志。
  source_stage: R18
  scope: V1_AND_LONG_TERM
  specifications: *id019
- decision_id: R18-A04
  status: ACTIVE
  title: 数据库迁移
  statement: 维护模式和迁移锁下执行；迁移前预检与备份，失败保持不可写并恢复旧一致状态。
  source_stage: R18
  scope: V1_AND_LONG_TERM
  specifications: *id019
- decision_id: R18-A05
  status: ACTIVE
  title: 签名升级
  statement: 验证签名发行清单、健康预检、备份、迁移、启动、自动验收，失败恢复旧版本。
