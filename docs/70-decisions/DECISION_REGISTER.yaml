  statement: codex/codex-default 不启用项目级 context soft/hard limit；可测量 route bytes 和显式容量下的 ratio，但不因 55%/70% 或 ratio 强制拆批，Section ID、渐进披露、禁止批量读取、binding、stale route、schema 和 target 校验继续强制；不声明模型物理上下文无限。
